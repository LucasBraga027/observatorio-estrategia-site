- title: "O Impacto Disruptivo das Deeptechs nos Ecossistemas de Inovação: Estratégias, Modelos de Negócios, Políticas Públicas e Criação de Novos Mercados"
  description: "<b>Escopo do projeto:</b> Este projeto, com foco no universo das Deeptechs, realiza análise da inovação tecnológica, modelo de negócios e ecossistemas de inovação, examinando como tecnologias reconfiguram estruturas, atores e dinâmicas de valor, promovendo a evolução, orquestração e transformação de ecossistemas, bem como a emergência de novos mercados.<br><br><b>Metodologia e Impacto:</b> O projeto é desenvolvido com abordagem qualitativa, através do estudo de caso de deeptechs brasileiras, incubadas e aceleradas por programas de centros de desenvolvimento tecnológico de universidades públicas brasileiras. O projeto visa gerar impacto positivo em relação à criação, crescimento e longevidade das Deeptechs brasileiras."
