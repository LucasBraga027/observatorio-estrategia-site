- title: "Estratégia, geopolítica e internacionalização no Sul Global"
  description: "<b>Descrição da Linha:</b> A linha investiga como a fragmentação geoeconômica, os acordos comerciais e as dinâmicas de poder entre blocos econômicos e potências globais reconfiguram as estratégias de internacionalização e as condições de inserção competitiva de empresas brasileiras e do Sul Global. Em perspectiva crítica, multiescalar e sensível ao contexto periférico, analisa como geopolítica, sistemas de comércio internacional, acordos multilaterais e bilaterais, e dinâmicas de expansão de potências produzem assimetrias estruturais, constrangimentos e oportunidades de reposicionamento para firmas domésticas, multinacionais brasileiras e atores organizacionais em posições periféricas."
