- title: "Efeitos da Inteligência Artificial na Aprendizagem e Estratégias de Políticas Públicas Educacionais"
  description: "<b>Escopo do projeto:</b> Este projeto investiga os efeitos do uso intensivo de ferramentas de IA generativa por parte de estudantes e professores do ensino superior e do ensino médio de instituições públicas brasileiras, através da mensuração de três construtos: nível de dependência de IA, descarregamento cognitivo e pensamento crítico. A pesquisa irá coletar dados de mais de 1000 participantes, oferecendo um recorte nacional para mapeamento e descrição sobre os efeitos do uso de IA na cognição e pensamento dos estudantes brasileiros, subsidiando futuras políticas públicas.<br><br><b>Metodologia e Impacto:</b> O projeto é desenvolvido com abordagem multi-método, tendo uma etapa quantitativa, com amostra de 1250 participantes das 5 regiões brasileiras, e etapa final qualitativa, com entrevistas em profundidade com 65 participantes. Os impactos do projeto visam a construção de orientações para desenho de políticas públicas para proteção da cognição humana no contexto educacional, bem como desenvolvimento de conteúdo de divulgação científica para estudantes, familiares, educadores e profissionais da educação em geral."
  image: ""
  tags:
    - "INTELIGÊNCIA ARTIFICIAL"
    - "EDUCAÇÃO"
    - "POLÍTICAS PÚBLICAS"
