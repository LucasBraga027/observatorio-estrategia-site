- title: "Efeitos da Inteligência Artificial na Aprendizagem e Estratégias de Políticas Públicas Educacionais"
  description: "Este projeto investiga os efeitos do uso intensivo de ferramentas de IA generativa por parte de estudantes e professores do ensino superior e do ensino médio de instituições públicas brasileiras, através da mensuração de três construtos: nível de dependência de IA, descarregamento cognitivo e pensamento crítico."
