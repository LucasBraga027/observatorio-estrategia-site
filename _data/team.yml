- category: "Imaginação Estratégica"
  description: >
    <b>Escopo do projeto:</b> Este projeto investiga processos imaginativos de gestores e executivos de organizações públicas e privadas, de diferentes portes, em relação ao uso da imaginação durante o processo de formulação estratégica, tanto em nível individual quanto coletivo. São mapeados processos imaginativos e analisados seus resultados em termos de desempenho estratégico.<br><br>
    <b>Metodologia e Impacto:</b> O projeto é desenvolvido com abordagem qualitativa, através de entrevistas qualitativas com profissionais envolvidos com formulação estratégica nos últimos 2 anos. O impacto do projeto visa contribuir para desenvolvimento de estratégias sustentáveis, que contribuam para desempenho positivo das organizações, além de subsidiar o desenvolvimento de modelos de letramento imaginativo, apoiando a aprendizagem da imaginação estratégica por parte dos gerentes.
