- category: "Monitoramento e Prospecção Tecnológicos com emprego de Ciência de Dados e IA"
  description: >
    <b>Descrição da Linha:</b> Desenvolver, implementar e documentar um framework metodológico e computacional de monitoramento tecnológico orientado por ciência de dados e IA, capaz de integrar dados de patentes, publicações científicas, bases de dados diversas, e gerar insumos estruturados para suporte à decisão e formulação de estratégias de inovação em diferentes domínios tecnológicos.<br><br>
    <b>Projetos ativos:</b> Desenvolvimento de um Framework de Monitoramento Tecnológico Orientado por Ciência de Dados e Inteligência Artificial para Suporte à Decisão e Formulação de Estratégias de Inovação.
