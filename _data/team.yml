- category: "Sistemas e Conexões Sustentáveis - SiCS"
  description: >
    <b>Descrição da Linha:</b> Pesquisar e analisar sistemas e conexões sustentáveis, apresentando proposições éticas, sugestões teóricas, práticas e estratégicas que contribuem para a sustentabilidade do planeta.<br><br>
    <b>Projetos ativos:</b> Moda e sustentabilidade: convergências e divergências estratégicas; Great Place to Work (GPTW) is a social sustainable and market strategy or just a ‘title’ in ISE/B3 companies?
